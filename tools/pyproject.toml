[project]
name = "epoch-tools"
version = "0.1.0"
description = "Build-time tooling for the Epoch study timer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
epoch-chime = "epoch_tools.chime:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
